<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<div class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl shadow-slate-200/60 overflow-hidden border border-slate-100">
        
        <div class="px-8 pt-10 pb-6 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 text-[var(--primary-color)!important] rounded-2xl mb-4 transition-transform hover:rotate-12">
                <i class="bi bi-chat-heart fs-2 text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 tracking-tight">Share Your Feedback</h2>
            <p class="text-slate-500 mt-2">We’d love to hear your thoughts on how we can improve.</p>
        </div>

        <form method="post" action="/feedback" class="px-8 pb-10 space-y-6" aria-label="Feedback form">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="name" class="block text-sm font-semibold text-slate-700 ml-1">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" id="name" name="name" required 
                            class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                            placeholder="John Doe">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="email" class="block text-sm font-semibold text-slate-700 ml-1">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" id="email" name="email" required 
                            class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                            placeholder="you@example.com">
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label for="message" class="block text-sm font-semibold text-slate-700 ml-1">Message</label>
                <textarea id="message" name="message" rows="5" required 
                    class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-none"
                    placeholder="Tell us what's on your mind..."></textarea>
            </div>

            <div class="pt-2">
                <button type="submit" 
                    class="group w-full bg-[var(--primary-color)!important] hover:bg-[var(--primary-color)]/80 text-white font-bold py-4 px-6 rounded-xl flex items-center justify-center gap-3 transition-all active:scale-[0.98]">
                    <span>Send Feedback</span>
                    <i class="bi bi-send-fill transition-transform group-hover:translate-x-1 group-hover:-translate-y-1"></i>
                </button>
            </div>
            
            <p class="text-center text-xs text-slate-400 mt-4">
                Your privacy is important to us. We never share your details.
            </p>
        </form>
    </div>
</div>
