{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/donateblood.css') }}">

<div class="donate-container">
    <div class="donate-left">
        <h1>Donate Blood. Save Lives.</h1>
        <p class="mb-1">Your single act of kindness can give someone a lifetime.</p>

        <form action="{{ url_for('user.donate_blood') }}" method="POST" class="donateblood-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required>
            </div>

            <div class="form-group">
                <label for="blood_type">Blood Type</label>
                <select id="blood_type" name="blood_type" required>
                    <option value="">Select</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="DOB">Date of Birth</label>
                <input type="date" id="DOB" name="DOB" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <br>

            <button type="submit" class="butonUI">Donate Now</button>
        </form>
    </div>

    <div class="donate-right">
        <img src="{{ url_for('static', filename='static_images/bd_img1.jpeg') }}" alt="Donate Blood Illustration">
        <div class="overlay-text">
            <h2>Be the reason someone smiles today ❤️</h2>
        </div>
    </div>
</div>
{% endblock %}
