{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='CSS/editProfile.css') }}">

<main id="main-content" aria-label="Edit Profile">
  <section class="container py-5">
    <div class="card shadow-lg border-0 overflow-hidden">
      <div class="row g-0">
        <!-- Left side image -->
        <div class="col-md-5 d-none d-md-block position-relative">
          <img src="{{ url_for('static', filename='static_images/profile-hero.png') }}" 
               alt="Profile Hero - Modern Donor" 
               class="img-fluid h-100 w-100" 
               style="object-fit: cover;">
          <div class="position-absolute top-0 start-0 w-100 h-100" style="background: rgba(0,0,0,0.1);"></div>
        </div>
        <!-- Right side form -->
        <div class="col-md-7">
          <div class="card-body p-4 p-md-5">
            <h2 class="fw-bold mb-4 text-primary">Edit Profile</h2>
            <form action="{{ url_for('user.edit_profile') }}" method="POST" enctype="multipart/form-data" aria-label="Edit Profile Form">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="fullname" class="form-label fw-semibold">Full Name</label>
                  <input type="text" class="form-control" id="fullname" name="fullname" value="{{ user.full_name }}" required aria-required="true">
                </div>
                <div class="col-md-6">
                  <label for="username" class="form-label fw-semibold">Username</label>
                  <input type="text" class="form-control bg-light" id="username" name="username" value="{{ user.username }}" required aria-required="true">
                </div>
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="phone" class="form-label fw-semibold">Phone</label>
                  <input type="text" class="form-control" id="phone" name="phone" value="{{ user.phone }}" required aria-required="true">
                </div>
                <div class="col-md-6">
                  <label for="address" class="form-label fw-semibold">Address</label>
                  <input type="text" class="form-control" id="address" name="address" value="{{ user.address }}" required aria-required="true">
                </div>
              </div>
              <div class="mb-4">
                <label for="profile_picture" class="form-label fw-semibold">Profile Picture</label>
                <input type="file" class="form-control" id="profile_picture" name="profile_picture" aria-label="Upload Profile Picture">
              </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg shadow-sm">Update Profile</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}
