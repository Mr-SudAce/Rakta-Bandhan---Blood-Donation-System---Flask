{% extends 'base.html' %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/admin/events.css') }}">

<div class="container admin-events-container">
    <div class="admin-card">
        <div class="admin-card-header">
            <h2><i class="bi bi-info-circle"></i> Event Details</h2>
            <div>
                <a href="{{ url_for('dashboard.admin_edit_event', event_id=event.id) }}" class="btn btn-warning btn-sm text-dark fw-bold">
                    <i class="bi bi-pencil"></i> Edit
                </a>
                <a href="{{ url_for('dashboard.admin_events') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </div>
        
        <div class="admin-card-body p-4">
            <div class="row">
                <div class="col-md-4 mb-4">
                    {% if event.camp_img %}
                        <img src="{{ url_for('static', filename='uploads/' + event.camp_img) }}" class="img-fluid rounded-3 shadow-sm w-100" alt="{{ event.title }}">
                    {% else %}
                        <div class="bg-light rounded-3 d-flex align-items-center justify-content-center" style="height: 250px;">
                            <span class="text-muted">No Image Available</span>
                        </div>
                    {% endif %}
                </div>
                <div class="col-md-8">
                    <h3 class="fw-bold mb-3">{{ event.title }}</h3>
                    <p class="text-muted mb-4">{{ event.description }}</p>
                    
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="p-3 border rounded-3 bg-light">
                                <small class="text-muted d-block text-uppercase fw-bold">Location</small>
                                <span class="fs-5"><i class="bi bi-geo-alt text-danger"></i> {{ event.location }}</span>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="p-3 border rounded-3 bg-light">
                                <small class="text-muted d-block text-uppercase fw-bold">Date</small>
                                <span class="fs-5"><i class="bi bi-calendar-event text-primary"></i> {{ event.date.strftime('%d %b, %Y') }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
