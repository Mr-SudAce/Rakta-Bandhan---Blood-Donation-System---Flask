{% extends 'base.html' %}

{% block title %}Feedback{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/main.css') }}">
<main id="main-content" aria-label="Feedback">
  <section class="card" style="max-width: 520px; margin: 2rem auto;">
    <h2>We Value Your Feedback</h2>
    <form method="post" action="/feedback" aria-label="Feedback form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" class="form-control" required aria-required="true" placeholder="Your Name">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" class="form-control" required aria-required="true" placeholder="you@example.com">
      <label for="message">Message</label>
      <textarea id="message" name="message" class="form-control" rows="4" required aria-required="true" placeholder="Your feedback..."></textarea>
      <button type="submit" class="butonUI" style="margin-top:1.2rem;">Send Feedback</button>
    </form>
  </section>
</main>
{% endblock %}
