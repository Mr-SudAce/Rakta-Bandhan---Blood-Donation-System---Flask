{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='CSS/editProfile.css') }}">

<div class="edit-profile-wrapper">

  <!-- Left side image -->
  <div class="image-side">
    <img src="{{ url_for('static', filename='static_images/profile-hero.png') }}" alt="Profile Hero">
  </div>

  <!-- Right side form -->
  <div class="form-side">
    <div class="form-container">
      <h2>Edit Profile</h2>

      <form action="{{ url_for('user.edit_profile') }}" method="POST" enctype="multipart/form-data">

        <div class="d-flex gap-2">
          <!-- Full Name -->
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" value="{{ user.full_name }}" required>
          </div>

          <!-- Username (read-only if you don't want to edit it) -->
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ user.phone }}" required>
          </div>
        </div>

        <div class="d-flex gap-2">
          <!-- Address -->
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" value="{{ user.address }}" required>
          </div>

          <!-- Profile Picture -->
          <div class="form-group">
            <label for="profile_picture">Profile Picture</label>
            <input type="file" id="profile_picture" name="profile_picture">
          </div>
        </div>

        <button type="submit" class="butonUI">Update Profile</button>
      </form>
    </div>
  </div>

</div>

{% endblock %}
