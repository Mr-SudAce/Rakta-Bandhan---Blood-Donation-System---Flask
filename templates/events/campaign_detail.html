{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='campaign.css') }}">
<h1>{{ campaign.title }}</h1>
<div class="campaignImg">
    {% if campaign.camp_img %}
    <img src="{{ url_for('static', filename='campaigns/' + campaign.camp_img) }}" alt="{{ campaign.title }}">
    {% else %}
    <img src="{{ url_for('static', filename='defaultImg/noimage.jpg') }}" alt="{{ campaign.title }}">
    {% endif %}
</div>
<p><strong>Description:</strong> {{ campaign.description }}</p>
<p><strong>Location:</strong> {{ campaign.location }}</p>
<p><strong>Date:</strong> {{ campaign.date.strftime('%d %b, %Y') }}</p>
<p><strong>Organizer:</strong> {{ campaign.organizer }}</p>
{% endblock %}
