{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/editProfile.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<main id="main-content" class="bg-light py-5" aria-label="Edit Profile">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card border-0 shadow-lg overflow-hidden mt-28" style="border-radius: 20px;">
          <div class="row g-0">
            
            <div class="col-md-5 d-none d-md-flex align-items-center justify-content-center position-relative bg-[var(--primary-color)]">
              <img src="{{ url_for('static', filename='static_images/profile-hero.png') }}" 
                   alt="Profile Hero" 
                   class="img-fluid h-100 w-100" 
                   style="object-fit: cover; opacity: 0.8;">
              <div class="position-absolute text-white text-center p-4">
                <h3 class="fw-bold">Keep it Fresh</h3>
                <p class="font-bold text-[15px]">Your profile is how the community sees you. Keep your information up to date.</p>
              </div>
            </div>

            <div class="col-md-7 bg-white">
              <div class="card-body p-4 p-lg-5">
                <div class="d-flex align-items-center mb-4">
                  
                  <h2 class="fw-bold mb-0">Edit Profile</h2>
                </div>

                <form action="{{ url_for('user.edit_profile') }}" method="POST" enctype="multipart/form-data">
                  
                  <div class="text-center mb-4">
                    <div class="position-relative d-inline-block">
                      <img id="preview" src="{{ url_for('static', filename='uploads/' + user.profile_picture) if user.profile_picture else 'https://via.placeholder.com/120' }}" 
                           class="rounded-circle border border-4 border-white shadow-sm" 
                           style="width: 120px; height: 120px; object-fit: cover;">
                      <label for="profile_picture" class="btn btn-sm btn-dark position-absolute bottom-0 end-0 rounded-circle">
                        <i class="bi bi-camera-fill"></i>
                      </label>
                    </div>
                    <input type="file" class="d-none" id="profile_picture" name="profile_picture" onchange="previewImage(event)">
                  </div>

                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-uppercase text-muted">Full Name <i class="bi bi-asterisk font-bold text-danger text-[10px]"></i></label>
                      <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" name="fullname" value="{{ user.full_name }}" required>
                      </div>
                    </div>
                    
                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-uppercase text-muted">Username <i class="bi bi-asterisk font-bold text-danger text-[10px]"></i></label>
                      <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-at"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" name="username" value="{{ user.username }}" required>
                      </div>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-uppercase text-muted">Phone Number <i class="bi bi-asterisk font-bold text-danger text-[10px]"></i></label>
                      <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-telephone"></i></span>
                        <input type="tel" class="form-control border-start-0 ps-0" name="phone" value="{{ user.phone }}" required>
                      </div>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label small fw-bold text-uppercase text-muted">Address <i class="bi bi-asterisk font-bold text-danger text-[10px]"></i></label>
                      <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" name="address" value="{{ user.address }}" required>
                      </div>
                    </div>
                  </div>

                  <hr class="my-4 opacity-50">

                  <div class="d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('user.profile') }}" class="btn btn-link text-decoration-none text-muted small">Cancel</a>
                    <button type="submit" class="btn bg-[var(--primary-color)!important] text-white font-bolder px-5 py-2 shadow-sm rounded-pill">
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function() {
      const output = document.getElementById('preview');
      output.src = reader.result;
    }
    reader.readAsDataURL(event.target.files[0]);
  }
</script>
{% endblock %}
