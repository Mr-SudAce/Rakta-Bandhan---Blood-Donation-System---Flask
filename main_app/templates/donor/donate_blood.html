{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/donateblood.css') }}">

<div class="donate-container">
    <div class="donate-left">
        <h1>Donate Blood. Save Lives.</h1>
        <p class="mb-1">Your single act of kindness can give someone a lifetime.</p>

        <form action="{{ url_for('user.donate_blood') }}" method="POST" class="donateblood-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" value="{{ current_user.donor.name if current_user.donor and current_user.donor.name else current_user.username }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{current_user.email}}" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" value="{{current_user.phone}}" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{current_user.address}}" required>
            </div>

            <div class="form-group">
                <label for="blood_type">Blood Type</label>
                <select id="blood_type" name="blood_type" required>

                    <option value>Select</option>

                    <option value="A+" {% if current_user.blood_grp == 'A+' %}selected{% endif %}>A+</option>
                    <option value="A-" {% if current_user.blood_grp == 'A-' %}selected{% endif %}>A-</option>
                    <option value="B+" {% if current_user.blood_grp == 'B+' %}selected{% endif %}>B+</option>
                    <option value="B-" {% if current_user.blood_grp == 'B-' %}selected{% endif %}>B-</option>
                    <option value="O+" {% if current_user.blood_grp == 'O+' %}selected{% endif %}>O+</option>
                    <option value="O-" {% if current_user.blood_grp == 'O-' %}selected{% endif %}>O-</option>
                    <option value="AB+" {% if current_user.blood_grp == 'AB+' %}selected{% endif %}>AB+</option>
                    <option value="AB-" {% if current_user.blood_grp == 'AB-' %}selected{% endif %}>AB-</option>

                </select>
            </div>

            <div class="form-group">
                <label for="DOB">Date of Birth</label>
                <input type="date" id="DOB" name="DOB" value="{{current_user.DOB}}" required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option>Select</option>
                    <option value="Male" {% if current_user.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if current_user.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if current_user.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <br>

            {% if eligibility  %}
            <button type="submit" class="butonUI" style="background-color: green;">Donate Now</button>
            {% else %}
            <button type="button" class="butonUI" style="background-color: yellow; color: var(--primary);" id="notEligibleBtn">Donate Now</button>
            {% endif %}

        </form>
    </div>

    <div class="donate-right">
        <img src="{{ url_for('static', filename='static_images/bd_img1.jpeg') }}" alt="Donate Blood Illustration">
        <div class="overlay-text">
            <h2>Be the reason someone smiles today ❤️</h2>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const btn = document.getElementById("notEligibleBtn");
    
        if (btn) {
            btn.addEventListener("click", function() {
                alert("You are not eligible to donate right now. You must be 18years old");
            });
        }
    });
    </script>
{% endblock %}
