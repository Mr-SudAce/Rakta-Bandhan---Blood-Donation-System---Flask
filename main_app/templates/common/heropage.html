<link rel="stylesheet" href="{{ url_for('static', filename='CSS/heropage.css') }}">

<section class="hero">

    <div class="hero__overlay">
        <div class="hero__imageframe">
            <img src="{{url_for('static', filename='static_images/heropageimage.png')}}" alt="bdimg">
        </div>
        <div class="hero__content">
            <h1>Give Blood. Save Lives. Repeat.</h1>
            <p>Find donors fast, register to donate, and track local blood drives — all in one place.</p>

            <div class="hero__actions">
                <a href="{{url_for('user.donate_blood')}}" class="btn">Donate Now</a>
                <a href="{{url_for('user.find_blood')}}" class="btn">Find Blood</a>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="stat__num">1,284</span>
                    <span class="stat__label">Active Donors</span>
                </div>
                <div class="stat">
                    <span class="stat__num">342</span>
                    <span class="stat__label">Urgent Requests</span>
                </div>
                <div class="stat">
                    <span class="stat__num">87</span>
                    <span class="stat__label">Campaigns</span>
                </div>
            </div>
        </div>
    </div>
</section>
