
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/feedback.css') }}">
<div class="feedback-section">
    <h2 class="section-title">Share Your Feedback</h2>
    <form method="post" action="/feedback" class="feedback-form" aria-label="Feedback form">
      <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-control" required placeholder="Your Name">
      </div>
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-control" rows="4" required placeholder="Your thoughts..."></textarea>
      </div>
      <button type="submit" class="btn-submit-feedback">Send Feedback</button>
    </form>
</div>
