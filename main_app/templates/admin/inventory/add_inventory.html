<div class="add-inv-section-container">
    <button class="add-inv-toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#invAddForm">
        + Add New Inventory Item
    </button>




    <div class="collapse" id="invAddForm">
        <form action="{{ url_for('dashboard.add_inventory') }}" method="POST" class="add-inv-form">
            <div class="add-inv-row">
                <div class="add-inv-col">
                    <label class="add-inv-label">Blood Group</label>
                    <select name="blood_group" class="add-inv-input" required>
                        <option value>Select</option>
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </div>

                <div class="add-inv-col">
                    <label class="add-inv-label">Component</label>
                    <select name="component" class="add-inv-input" required>
                        <option value>Select</option>
                        <option>Whole Blood</option>
                        <option>Plasma</option>
                        <option>Platelets</option>
                        <option>RBCs</option>
                    </select>
                </div>
            </div>

            <div class="add-inv-row">
                <div class="add-inv-col">
                    <label class="add-inv-label">Quantity</label>
                    <input type="number" name="quantity" class="add-inv-input" min="1" required>
                </div>
                <div class="add-inv-col">
                    <label class="add-inv-label">Collection Date</label>
                    <input type="date" name="collection_date" class="add-inv-input" required>
                </div>
            </div>

            <div class="add-inv-row">
                <div class="add-inv-col-full">
                    <label class="add-inv-label">Expiry Date</label>
                    <input type="date" name="expiry_date" class="add-inv-input" required>
                </div>
            </div>

            <button type="submit" class="add-inv-submit-btn">Add Stock</button>
        </form>
    </div>
</div>
