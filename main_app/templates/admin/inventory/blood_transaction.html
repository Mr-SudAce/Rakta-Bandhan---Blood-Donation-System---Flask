
<div class="transact-inv-section-container">
    <button class="transact-inv-toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#transactForm">
        Sell Blood Unit
    </button>

    <div class="collapse" id="transactForm">
        <form action="{{ url_for('dashboard.sell_inventory') }}" method="POST" class="transact-inv-form">
            <div class="transact-row">
                <div class="transact-col">
                    <label class="transact-label">Blood Group</label>
                    <select name="blood_group" class="transact-input" required>
                        <option value>Select</option>
                        {% for item in inventory %}
                        <option value="{{ item.blood_group }}">{{ item.blood_group }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="transact-col">
                    <label class="transact-label">Component</label>
                    <select name="component" class="transact-input" required>
                        <option value>Select</option>
                        {% for item in inventory|unique(attribute='component') %}
                        <option value="{{ item.component }}">{{ item.component }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="transact-row">
                    <div class="transact-col">
                        <label class="transact-label">Quantity</label>
                        <input type="number" name="quantity" class="transact-input" min="1" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="transact-submit-btn">Sell</button>
        </form>
    </div>
</div>
