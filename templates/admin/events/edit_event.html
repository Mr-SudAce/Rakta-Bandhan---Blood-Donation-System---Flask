{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="fw-bold mb-4">Edit Event</h2>

    <form method="POST" action="{{ url_for('admin_edit_event', event_id=event.id) }}">
        <div class="mb-3">
            <label for="title" class="form-label">Event Title</label>
            <input
                type="text"
                class="form-control"
                id="title"
                name="title"
                value="{{ event.title }}"
                required>
        </div>

        <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input
                type="date"
                class="form-control"
                id="date"
                name="date"
                value="{{ event.date.strftime('%Y-%m-%d') if event.date else '' }}"
                required>
        </div>
        <div class="mb-3">
            <label for="exp_date" class="form-label">Exp. Date</label>
            <input
                type="date"
                class="form-control"
                id="exp_date"
                name="exp_date"
                value="{{ event.exp_date.strftime('%Y-%m-%d') if event.exp_date else '' }}"
                required>
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input
                type="text"
                class="form-control"
                id="location"
                name="location"
                value="{{ event.location }}"
                required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="4"
                placeholder="Add event details here...">{{ event.description }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{{ url_for('admin_events') }}" class="btn btn-secondary">⬅️ Back</a>
            <button type="submit" class="btn btn-primary">💾 Update Event</button>
        </div>
    </form>
</div>
{% endblock %}
